<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быстрый Сканер QR</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
        <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background-color: #121212; 
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 30px auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 24px; margin-bottom: 5px; color: #fff; }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        
        #reader {
            width: 100% !important;
            border: none !important;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }
     
        #reader button {
            background: linear-gradient(135deg, #2f80ed, #0071e3);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.4);
            transition: transform 0.2s;
        }
        #reader button:active { transform: scale(0.98); }
        
        
        #reader__scan_region {
            background: rgba(0,0,0,0.4);
        }
        
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #2f80ed;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Сканер QR-кода</h1>
        <p>Разрешите доступ к камере и наведите её на QR-код со ссылкой</p>
        
       
        <div id="reader"></div>
        
      
        <div id="status">Ожидание сканирования...</div>
    </div>

    <script>
        
        function onScanSuccess(decodedText, decodedResult) {
           
            document.getElementById('status').innerText = "Ссылка найдена! Переходим...";
            document.getElementById('status').style.color = "green";
            
            
            if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                
                window.open(decodedText, '_blank');
            } else {
                
                document.getElementById('status').innerText = "Внутри QR не ссылка, а текст: " + decodedText;
                document.getElementById('status').style.color = "orange";
            }
        }

        function onScanFailure(error) {
           
        }
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 15, 
                qrbox: { width: 250, height: 250 },
                rememberLastUsedCamera: true 
            }, 
            /* verbose= */ false
        );
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
